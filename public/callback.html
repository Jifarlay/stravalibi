<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stravalibi — Connexion Strava</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f0f;color:#f5f5f3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.box{background:#1a1a1a;border:1px solid #2e2e2e;border-radius:16px;padding:2.5rem;text-align:center;max-width:420px;width:100%}
.icon{width:64px;height:64px;border-radius:16px;background:#FC4C02;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem}
h2{font-size:20px;font-weight:700;margin-bottom:8px}
p{font-size:14px;color:#a0a09a;line-height:1.6;margin-bottom:1.5rem}
.spinner{width:32px;height:32px;border:3px solid #2e2e2e;border-top-color:#FC4C02;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-block;padding:12px 24px;background:#FC4C02;color:#fff;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;border:none;cursor:pointer}
.ok{color:#1D9E75;font-weight:600;font-size:15px}
.err{color:#e24b4a;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="box">
  <div class="icon">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <rect x="3" y="12" width="5" height="11" rx="2" fill="white"/>
      <rect x="26" y="12" width="5" height="11" rx="2" fill="white"/>
      <rect x="6" y="17" width="22" height="8" rx="2" fill="white"/>
      <rect x="7" y="12" width="20" height="6" rx="2" fill="rgba(255,255,255,0.6)"/>
      <rect x="8" y="24" width="3" height="4" rx="1" fill="white"/>
      <rect x="23" y="24" width="3" height="4" rx="1" fill="white"/>
      <rect x="8" y="18" width="8" height="6" rx="1.5" fill="rgba(255,255,255,0.3)"/>
      <rect x="18" y="18" width="8" height="6" rx="1.5" fill="rgba(255,255,255,0.3)"/>
    </svg>
  </div>
  <div id="content">
    <div class="spinner"></div>
    <h2>Connexion à Strava…</h2>
    <p>Upload de ton activité en cours, ne ferme pas cette fenêtre.</p>
  </div>
</div>

<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  const el = document.getElementById('content');

  if (error || !code) {
    el.innerHTML = `<p class="err">Connexion annulée ou refusée.</p><br><a href="/" class="btn">Retour</a>`;
    return;
  }

  // Récupérer les données GPX stockées temporairement
  const pending = JSON.parse(sessionStorage.getItem('stravalibi_pending') || 'null');
  if (!pending) {
    el.innerHTML = `<p class="err">Session expirée. Recommence depuis le début.</p><br><a href="/" class="btn">Retour</a>`;
    return;
  }

  try {
    const res = await fetch('/.netlify/functions/strava-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, ...pending }),
    });

    const data = await res.json();

    if (data.success) {
      sessionStorage.removeItem('stravalibi_pending');
      el.innerHTML = `
        <p class="ok">✓ Activité envoyée sur Strava !</p>
        <p style="margin-top:12px">Elle apparaîtra dans ton profil dans quelques secondes.</p>
        <br>
        <a href="https://www.strava.com/athlete/training" target="_blank" class="btn" style="margin-right:8px">Voir sur Strava</a>
        <a href="/" class="btn" style="background:transparent;border:1px solid #FC4C02;color:#FC4C02">Nouvelle activité</a>
      `;
    } else {
      throw new Error(data.error || 'Erreur inconnue');
    }
  } catch (err) {
    el.innerHTML = `<p class="err">Erreur : ${err.message}</p><br><a href="/" class="btn">Retour</a>`;
  }
})();
</script>
</body>
</html>
